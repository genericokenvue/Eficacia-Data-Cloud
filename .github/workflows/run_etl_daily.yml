name: Run ETL Suite Eficacia — Diario Automático

# Corre run_all.py una vez al día, con todos los ETLs, periodo actual, y
# regenerando GOLD al final. Sin inputs que configurar — para correr algo
# distinto (un ETL suelto, otro periodo, sin GOLD, etc.) usa el workflow
# "Run ETL Suite Eficacia" manualmente en su lugar.

on:
  schedule:
    # Cron en UTC. Colombia es UTC-5 todo el año (sin horario de verano),
    # así que "hora Colombia + 5" = hora UTC a poner aquí.
    # '0 13 * * *' = 13:00 UTC = 8:00 a.m. hora Colombia, todos los días.
    - cron: '0 13 * * *'

  # Permite además correr este mismo workflow a mano (con el botón "Run
  # workflow" en GitHub), sin inputs, útil para probarlo sin esperar al cron.
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todo el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar run_all.py (todos los ETLs + GOLD, periodo actual)
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Ejecutando run_all.py --workers 6 --gold"
          python run_all.py --workers 6 --gold