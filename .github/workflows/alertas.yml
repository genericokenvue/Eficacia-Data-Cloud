name: Ejecutar Sistema de Alertas

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Qué correr'
        required: true
        type: choice
        default: 'run_alertas'
        options:
          - run_alertas            # Fases A+B+C (calcular + telegram + email)
          - calcular_cumplimientos # Solo Fase A (calcula y guarda en SharePoint)
          - alertas_telegram       # Solo Fase B (requiere haber corrido calcular antes)
          - alertas_email          # Solo Fase C (requiere haber corrido calcular antes)
          - reintentar_telegram    # Reenvía Telegram SOLO a los supervisores en "supervisores"
          - reintentar_email       # Reenvía correo SOLO a los supervisores en "supervisores"
      fases:
        description: 'Solo para run_alertas: fases a correr, separadas por espacio (ej: "calcular telegram"). Vacío = todas.'
        required: false
        default: ''
      supervisores:
        description: 'Para reintentar_telegram/reintentar_email/run_alertas: nombre(s) del/los supervisor(es), SEPARADOS POR COMA si son varios (ej: YENUBY MILENA LEON LUNA, ANA CAROLINA TEHERAN). Para run_alertas es opcional (vacío = todos); para reintentar_* es obligatorio.'
        required: false
        default: ''
      modo_prueba:
        description: 'Modo prueba (no envía Telegram/correos reales — aplica a run_alertas/alertas_telegram/alertas_email/reintentar_telegram/reintentar_email)'
        required: true
        type: boolean
        default: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todo el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          CORREO_REMITENTE:    ${{ secrets.CORREO_REMITENTE }}
          # Opcionales — si no se definen, el código usa sus valores por defecto:
          # UMBRAL_OK, UMBRAL_WARNING, ANALISTA_NOMBRE, ANALISTA_EMAIL
        run: |
          SCRIPT="${{ inputs.script }}"
          ARGS=""

          # Separar por COMA (no por espacio) para que cada nombre completo
          # (que trae espacios) llegue como UN solo argumento al script, en
          # vez de partirse en palabras sueltas — "MILENA" sola, por ejemplo,
          # le pega a varias personas distintas si se pasa suelta.
          SUP_ARR=()
          if [ -n "${{ inputs.supervisores }}" ]; then
            IFS=',' read -ra RAW <<< "${{ inputs.supervisores }}"
            for s in "${RAW[@]}"; do
              # trim de espacios al inicio/final de cada nombre
              trimmed="$(echo "$s" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$trimmed" ]; then
                SUP_ARR+=("$trimmed")
              fi
            done
          fi

          if [ "$SCRIPT" = "reintentar_telegram" ] || [ "$SCRIPT" = "reintentar_email" ]; then
            if [ "${#SUP_ARR[@]}" -eq 0 ]; then
              echo "❌ Falta el input 'supervisores' — obligatorio para $SCRIPT"
              exit 1
            fi
          fi

          # --prueba lo entienden todos menos calcular_cumplimientos.py
          # (ese no envía nada, así que no aplica ahí).
          if [ "${{ inputs.modo_prueba }}" = "true" ] && [ "$SCRIPT" != "calcular_cumplimientos" ]; then
            ARGS="$ARGS --prueba"
          fi

          if [ "$SCRIPT" = "run_alertas" ] && [ -n "${{ inputs.fases }}" ]; then
            ARGS="$ARGS --solo ${{ inputs.fases }}"
          fi

          echo "Ejecutando ALERTAS/${SCRIPT}.py"
          if [ "$SCRIPT" = "reintentar_telegram" ] || [ "$SCRIPT" = "reintentar_email" ]; then
            python "ALERTAS/${SCRIPT}.py" "${SUP_ARR[@]}" $ARGS
          elif [ "$SCRIPT" = "run_alertas" ] && [ "${#SUP_ARR[@]}" -gt 0 ]; then
            # run_alertas filtra el ENVÍO a los supervisores indicados con
            # --supervisor (el cálculo completo corre igual para todos,
            # solo se filtra a quién se le manda Telegram/Email).
            python "ALERTAS/${SCRIPT}.py" $ARGS --supervisor "${SUP_ARR[@]}"
          else
            python "ALERTAS/${SCRIPT}.py" $ARGS
          fi