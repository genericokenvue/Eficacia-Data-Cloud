name: Ejecutar Sistema de Alertas

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Qué correr'
        required: true
        type: choice
        default: 'run_alertas'
        options:
          - run_alertas            # Fases A+B+C (calcular + telegram + email)
          - calcular_cumplimientos # Solo Fase A (calcula y guarda en SharePoint)
          - alertas_telegram       # Solo Fase B (requiere haber corrido calcular antes)
          - alertas_email          # Solo Fase C (requiere haber corrido calcular antes)
          - reintentar_telegram    # Reenvía Telegram SOLO a los supervisores en "supervisores"
          - reintentar_email       # Reenvía correo SOLO a los supervisores en "supervisores"
      fases:
        description: 'Solo para run_alertas: fases a correr, separadas por espacio (ej: "calcular telegram"). Vacío = todas.'
        required: false
        default: ''
      supervisores:
        description: 'Para reintentar_telegram/reintentar_email/run_alertas: nombre del supervisor, SIN comillas (ej: YENUBY MILENA LEON LUNA). Para run_alertas es opcional (vacío = todos); para reintentar_* es obligatorio.'
        required: false
        default: ''
      modo_prueba:
        description: 'Modo prueba (no envía Telegram/correos reales — aplica a run_alertas/alertas_telegram/alertas_email/reintentar_telegram/reintentar_email)'
        required: true
        type: boolean
        default: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todo el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          CORREO_REMITENTE:    ${{ secrets.CORREO_REMITENTE }}
          # Opcionales — si no se definen, el código usa sus valores por defecto:
          # UMBRAL_OK, UMBRAL_WARNING, ANALISTA_NOMBRE, ANALISTA_EMAIL
        run: |
          SCRIPT="${{ inputs.script }}"
          ARGS=""
          SUPERVISORES="${{ inputs.supervisores }}"

          if [ "$SCRIPT" = "reintentar_telegram" ] || [ "$SCRIPT" = "reintentar_email" ]; then
            if [ -z "$SUPERVISORES" ]; then
              echo "❌ Falta el input 'supervisores' — obligatorio para $SCRIPT"
              exit 1
            fi
          fi

          # --prueba lo entienden todos menos calcular_cumplimientos.py
          # (ese no envía nada, así que no aplica ahí).
          if [ "${{ inputs.modo_prueba }}" = "true" ] && [ "$SCRIPT" != "calcular_cumplimientos" ]; then
            ARGS="$ARGS --prueba"
          fi

          if [ "$SCRIPT" = "run_alertas" ] && [ -n "${{ inputs.fases }}" ]; then
            ARGS="$ARGS --solo ${{ inputs.fases }}"
          fi

          # run_alertas puede filtrar el ENVÍO a un solo supervisor con
          # --supervisor (el cálculo completo corre igual, solo se filtra
          # a quién se le manda Telegram/Email).
          if [ "$SCRIPT" = "run_alertas" ] && [ -n "$SUPERVISORES" ]; then
            ARGS="$ARGS --supervisor $SUPERVISORES"
          fi

          echo "Ejecutando ALERTAS/${SCRIPT}.py"
          if [ "$SCRIPT" = "reintentar_telegram" ] || [ "$SCRIPT" = "reintentar_email" ]; then
            # $SUPERVISORES sin comillas: bash lo separa en palabras, y cada
            # palabra ya funciona como filtro de coincidencia parcial en el
            # script (no hace falta que sea el nombre completo exacto).
            python "ALERTAS/${SCRIPT}.py" $SUPERVISORES $ARGS
          else
            python "ALERTAS/${SCRIPT}.py" $ARGS
          fi