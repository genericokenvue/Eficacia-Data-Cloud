name: Run ETL Suite Eficacia

on:
  # 1. Permite ejecutar manualmente desde la web ingresando parámetros opcionales
  workflow_dispatch:
    inputs:
      argumentos:
        description: 'Parámetros de ejecución (Ej: --mes 7 --anio 2026)'
        required: false
        default: ''

  # 2. Programación automática opcional (Descomenta si quieres dejarlo fijo)
  # schedule:
  #   - cron: '0 7 * * 1-5' # De lunes a viernes a las 2:00 AM hora Colombia (7:00 AM UTC)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Clonar todo tu árbol de scripts en el servidor
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Paso 2: Configurar el entorno de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # Paso 3: Instalar las dependencias del requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Paso 4: Ejecutar el orquestador inyectando tus variables secretas
    - name: Execute ETL Script
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        # Si vas a ejecutar el orquestador general de todos tus scripts:
        python run_all.py ${{ github.event.inputs.argumentos }}
        
        # O si prefieres probar específicamente el de precios con los parámetros del input:
        # python etl_precios_supa_sharepoint.py ${{ github.event.inputs.argumentos }}