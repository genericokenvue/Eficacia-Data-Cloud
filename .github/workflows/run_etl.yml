name: Run ETL Suite Eficacia

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Nombre del script a ejecutar (Ej: etl_precios.py). Dejar vacío para run_all.py'
        required: false
        default: ''
      argumentos:
        description: 'Parámetros de fecha (Ej: --mes 7 --anio 2026)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar todo el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar ETL Seleccionada
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        # Validamos si el usuario escribió un script específico o si corre el orquestador general
        if [ -n "${{ github.event.inputs.script }}" ]; then
          echo "Ejecutando script individual: ${{ github.event.inputs.script }}"
          python ${{ github.event.inputs.script }} ${{ github.event.inputs.argumentos }}
        else
          echo "Ejecutando suite completa de ETLs..."
          python run_all.py ${{ github.event.inputs.argumentos }}
        fi